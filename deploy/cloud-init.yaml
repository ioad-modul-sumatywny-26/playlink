#cloud-config
# VM bootstrap used by deploy/azure-vm.sh, which fills in the placeholders
# written in double underscores. Installs Docker, clones the repository and
# enables the timer that keeps the stack up to date. No inbound port is needed.
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - jq

write_files:
  - path: /etc/systemd/system/playlink-update.service
    content: |
      [Unit]
      Description=Keep PlayLink (__REGION__) up to date
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=__UPDATE_CMD__
  - path: /etc/systemd/system/playlink-update.timer
    content: |
      [Unit]
      Description=Check for new PlayLink releases

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=2min

      [Install]
      WantedBy=timers.target

runcmd:
  - curl -fsSL https://get.docker.com | sh
  # 1 GiB RAM: swap keeps Postgres, Python and Bun from being OOM-killed.
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - git clone --branch __REF__ https://github.com/__REPO__.git /opt/playlink
  - systemctl daemon-reload
  - systemctl enable --now playlink-update.timer
